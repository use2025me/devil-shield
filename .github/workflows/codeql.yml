# CodeQL: GitHub's free security scanner. Reads Devil Shield's code on every change
# (and once a week) and reports common security mistakes under the Security tab.
name: CodeQL security scan

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Start CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build the app for scanning
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Scan
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
