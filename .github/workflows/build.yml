name: Build Devil Shield

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
      - ".github/workflows/codeql.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Starts a real WireGuard server on the build machine, so the built-in VPN is tested
      # against the real thing before every release.
      - name: Start a test WireGuard server
        id: wgserver
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools || { echo "::error::Couldn't install wireguard-tools"; exit 1; }
          umask 077
          wg genkey > server.key; wg pubkey < server.key > server.pub
          wg genkey > client.key; wg pubkey < client.key > client.pub
          if ! sudo ip link add wg0 type wireguard 2> wgerr.txt; then
            echo "::warning::Kernel WireGuard not available ($(cat wgerr.txt)), using wireguard-go instead"
            go install golang.zx2c4.com/wireguard@latest 2> goerr.txt || { echo "::error::wireguard-go install failed: $(tail -3 goerr.txt | tr '\n' ' ')"; exit 1; }
            sudo "$(go env GOPATH)/bin/wireguard" wg0 2> wggoerr.txt || { echo "::error::wireguard-go didn't start: $(cat wggoerr.txt | tr '\n' ' ')"; exit 1; }
            sleep 1
          fi
          # Newer Ubuntu only lets the wg tool read keys from /etc/wireguard.
          sudo mkdir -p /etc/wireguard
          sudo install -m 600 server.key /etc/wireguard/test-server.key
          sudo wg set wg0 listen-port 51820 private-key /etc/wireguard/test-server.key peer "$(cat client.pub)" allowed-ips 10.99.0.2/32 2> seterr.txt || { echo "::error::wg set failed: $(cat seterr.txt)"; exit 1; }
          sudo ip addr add 10.99.0.1/24 dev wg0
          sudo ip link set wg0 up
          sudo wg show
          echo "WG_TEST_CLIENT_KEY=$(cat client.key)" >> "$GITHUB_ENV"
          echo "WG_TEST_SERVER_PUB=$(cat server.pub)" >> "$GITHUB_ENV"

      - name: Test the built-in VPN against WireGuard
        if: steps.wgserver.outcome == 'success'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest || {
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              grep -o 'message="[^"]*"' "$f" | head -5 | sed 's/^/::error::/'
            done
            sudo wg show
            exit 1
          }
          # Proof from the WireGuard server itself that Devil Shield connected and sent data.
          echo "::notice::VPN test server saw: handshake $(sudo wg show wg0 latest-handshakes | awk '{print $2}'), transfer $(sudo wg show wg0 transfer | awk '{print $2" bytes in, "$3" bytes out"}')"
          if grep -q 'connectsAndPingsThroughRealWireGuard' app/build/test-results/testDebugUnitTest/*.xml && \
             grep -A2 'connectsAndPingsThroughRealWireGuard' app/build/test-results/testDebugUnitTest/*.xml | grep -q '<skipped'; then
            echo "::error::The real VPN test was skipped"; exit 1
          fi

      # The signing key is stored encrypted in signing/release.jks.enc.
      # It can only be unlocked with the SIGNING_PASSWORD repository secret.
      - name: Unlock signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::The SIGNING_PASSWORD secret is missing, so the app can't be signed. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" \
            -pass env:SIGNING_PASSWORD

      - name: Build signed APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: devilshield
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DevilShield.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          printf '%s\n' "${COMMIT_MSG:-New version}" > notes.txt
          gh release create "$TAG" DevilShield.apk \
            --title "Devil Shield $TAG" \
            --notes-file notes.txt \
            --latest

      - name: Keep a copy of the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: DevilShield-apk
          path: DevilShield.apk
